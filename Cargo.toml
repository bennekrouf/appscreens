[package]
name = "appscreens"
version = "0.1.9"
edition = "2021"
license-file = "LICENSE"

[dependencies]
dioxus = { version = "=0.7.3", features = ["desktop", "mobile"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tokio = { version = "1", features = ["full"] }
dirs = "5"
tracing-subscriber = "0.3"
imageproc = "0.25"
ab_glyph = "0.2"
hex = "0.4"
urlencoding = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Neither has an Android backend — rfd because SAF has no path-based dialog
# model to implement against (see src/android_saf.rs), dark-light because
# there's no per-app light/dark preference API on Android the way there is a
# system theme setting on desktop.
rfd = "0.15"
dark-light = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
