name: Release

on:
  push:
    tags:
      - 'v*'

  # ── Manual trigger from the GitHub Actions UI ──────────────────────────────
  # Actions → Release → Run workflow → enter version (e.g. 0.1.1)
  # Leave empty to auto-bump the patch version. Same effect as scripts/release.sh.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1) — empty = auto-bump patch'
        required: false
        default: ''
      bump:
        description: 'Bump type if version is empty'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  # ── When triggered via workflow_dispatch: bump version and create the tag ──
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -n "$VERSION_INPUT" ]]; then
            NEW="$VERSION_INPUT"
          elif [[ "$BUMP_TYPE" == "major" ]]; then
            NEW="$((MAJOR+1)).0.0"
          elif [[ "$BUMP_TYPE" == "minor" ]]; then
            NEW="$MAJOR.$((MINOR+1)).0"
          else
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
          fi

          TAG="v$NEW"
          echo "Bumping $CURRENT → $NEW (tag: $TAG)"

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" Cargo.toml

          git add Cargo.toml
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: macos-latest  # arm64 (Apple Silicon)
    env:
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APP_STORE_KEY:        ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      # ── Sanity-check required signing secrets up front ─────────────────────
      - name: Verify macOS signing secrets are present
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -z "${SIGNING_IDENTITY:-}"      ] && missing+=("MACOS_SIGNING_IDENTITY")
          [ -z "${APP_STORE_KEY:-}"        ] && missing+=("APP_STORE_CONNECT_KEY")
          [ -z "${APP_STORE_KEY_ID:-}"     ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "${APP_STORE_ISSUER_ID:-}"  ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "${MACOS_CERTIFICATE:-}"     ] && missing+=("MACOS_CERTIFICATE")
          [ -z "${MACOS_CERTIFICATE_PWD:-}" ] && missing+=("MACOS_CERTIFICATE_PWD")
          [ -z "${KEYCHAIN_PASSWORD:-}"     ] && missing+=("KEYCHAIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 7 macOS signing secrets present."

      # ── Import Developer ID cert into a temporary keychain ──────────────────
      - name: Set up signing keychain
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── Build the .app bundle (no dmg yet — we build & sign our own) ────────
      - name: Bundle .app
        run: dx bundle --platform desktop --release --package-types macos

      # `dx bundle` leaves two .app trees in target/: the one it assembles
      # itself (release/macos/) and the one cargo-bundle re-packages with the
      # generated .icns and PkgInfo (bundle/macos/macos/). Only the latter is a
      # complete app, and `find | head -1` picked between them by directory
      # order — which is how the v0.1.2 dmg shipped without Resources/assets and
      # rendered unstyled. Select the packaged one explicitly instead.
      - name: Locate packaged .app
        run: |
          set -euo pipefail
          APP=$(find target/dx -type d -name "*.app" -path "*/bundle/macos/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No packaged .app produced by dx bundle"
            find target/dx -type d -name "*.app" || true
            exit 1
          fi
          if [ ! -f "$APP/Contents/Info.plist" ] || [ ! -d "$APP/Contents/MacOS" ]; then
            echo "::error::$APP is not a complete app bundle"
            exit 1
          fi
          echo "Selected: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Codesign .app
        run: |
          set -euo pipefail
          echo "Signing: $APP"
          # Sign nested binaries first, then the bundle itself
          codesign --force --options runtime --timestamp \
            --entitlements .github/macos-entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            --deep \
            "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Create signed DMG
        run: |
          set -euo pipefail
          mkdir -p dist dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "AppScreens" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            dist/appscreens-macos-arm64.dmg
          codesign --force --timestamp \
            --sign "$SIGNING_IDENTITY" \
            dist/appscreens-macos-arm64.dmg

      - name: Notarize and staple
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo "$APP_STORE_KEY" | base64 --decode > "$P8"

          xcrun notarytool submit dist/appscreens-macos-arm64.dmg \
            --key "$P8" \
            --key-id "$APP_STORE_KEY_ID" \
            --issuer "$APP_STORE_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/appscreens-macos-arm64.dmg
          xcrun stapler validate dist/appscreens-macos-arm64.dmg

      - name: Hashes
        run: |
          cd dist
          shasum -a 256 appscreens-macos-arm64.dmg > SHA256SUMS-macos.txt
          ls -lh

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appscreens-macos
          path: dist/*

  build-linux:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Bundle
        run: dx bundle --platform desktop --release --package-types deb --package-types appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist
          DEB=$(find target -type f -name "*.deb" | head -1)
          APPIMAGE=$(find target -type f -name "*.AppImage" | head -1)
          [ -n "$DEB" ]      && cp "$DEB"      dist/appscreens-linux-x86_64.deb
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" dist/appscreens-linux-x86_64.AppImage
          ls -lh dist/
          (cd dist && sha256sum * > SHA256SUMS-linux.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appscreens-linux
          path: dist/*

  build-windows:
    needs: [prepare]
    if: always() && !failure() && !cancelled()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Bundle
        run: dx bundle --platform desktop --release --package-types msi

      - name: Collect unsigned .msi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $msi = Get-ChildItem -Path target -Recurse -Filter *.msi |
            Where-Object { $_.FullName -match "bundle" } |
            Select-Object -First 1
          if (-not $msi) { Write-Error "No .msi produced by dx bundle"; exit 1 }
          Copy-Item $msi.FullName dist\appscreens-windows-setup.msi
          Get-ChildItem dist

      # ── SignPath Foundation: code-sign the .msi for free (OSS only) ────────
      # Uncomment when SignPath Foundation has approved the project and the
      # required secret/inputs are configured. Until then the .msi ships
      # unsigned (SmartScreen will warn on download).
      #
      # Setup (one-time, after SignPath approval):
      #   1. Add repo secret `SIGNPATH_API_TOKEN`            (from SignPath dashboard).
      #   2. Replace the three placeholders below with values from your
      #      SignPath project page:
      #        - organization-id           (UUID)
      #        - project-slug              (e.g. "appscreens")
      #        - signing-policy-slug       (e.g. "release-signing")
      #
      # - name: Upload unsigned artifact to GitHub
      #   id: upload-unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: appscreens-windows-unsigned
      #     path: dist/appscreens-windows-setup.msi
      #
      # - name: Submit signing request to SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: 'REPLACE-WITH-SIGNPATH-ORG-UUID'
      #     project-slug:    'REPLACE-WITH-SIGNPATH-PROJECT-SLUG'
      #     signing-policy-slug: 'REPLACE-WITH-SIGNPATH-POLICY-SLUG'
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-signed
      #
      # - name: Replace .msi with the signed version
      #   shell: pwsh
      #   run: |
      #     Move-Item -Force dist-signed\appscreens-windows-setup.msi dist\appscreens-windows-setup.msi
      #     Write-Host "Signed .msi in place."

      # ── Compute SHA-256 AFTER signing so the hash matches what users get ───
      - name: Hash artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS-windows.txt' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          Set-Content -Path dist\SHA256SUMS-windows.txt -Value $lines -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appscreens-windows
          path: dist/*

  release:
    needs: [build-mac, build-linux, build-windows]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          MAC_DMG="appscreens-macos-arm64.dmg"
          LINUX_DEB="appscreens-linux-x86_64.deb"
          LINUX_APPIMAGE="appscreens-linux-x86_64.AppImage"
          WIN_MSI="appscreens-windows-setup.msi"

          sha() { [ -n "$1" ] && [ -f "release/$1" ] && sha256sum "release/$1" | awk '{print $1}' || echo ""; }

          cat > release/latest.json <<EOF
          {
            "name": "AppScreens",
            "version": "$VER",
            "tag": "$TAG",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "macos": {
                "dmg": { "url": "$BASE/$MAC_DMG", "sha256": "$(sha "$MAC_DMG")" }
              },
              "linux": {
                "deb":      { "url": "$BASE/$LINUX_DEB",      "sha256": "$(sha "$LINUX_DEB")" },
                "appimage": { "url": "$BASE/$LINUX_APPIMAGE", "sha256": "$(sha "$LINUX_APPIMAGE")" }
              },
              "windows": {
                "msi": { "url": "$BASE/$WIN_MSI", "sha256": "$(sha "$WIN_MSI")" }
              }
            }
          }
          EOF
          cat release/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag || github.ref_name }}"
          FILES=$(find release -type f | tr '\n' ' ')

          gh release create "$TAG" \
            --title "AppScreens $TAG" \
            --notes "$(cat <<'EOF'
          ## Download

          ### macOS (Apple Silicon)
          Download the `.dmg`, open it, and drag AppScreens to /Applications.
          Signed with Apple Developer ID and notarized — opens with a normal double-click.

          ### Linux
          - **Debian / Ubuntu**: download the `.deb` and `sudo dpkg -i AppScreens_*.deb`
          - **Other distros**: download the `.AppImage`, `chmod +x` it, and run

          ### Windows
          Download the `.msi` installer and run it. Windows SmartScreen may warn — click *More info → Run anyway* (the binary is unsigned).

          ## For mayorana.ch
          `latest.json` is attached to this release with download URLs and SHA-256 hashes.
          Stable link: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          EOF
          )" \
            $FILES
