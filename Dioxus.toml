[application]
name = "AppScreens"
default_platform = "desktop"
# Subclasses WryActivity to override onActivityResult — needed so the
# Storage Access Framework picker (src/android_saf.rs) can receive the
# result of an Intent.ACTION_OPEN_DOCUMENT launch. Path is relative to the
# crate root; the file is copied in as-is (not templated).
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "com.mayorana.appscreens"
publisher = "Mayorana"
copyright = "Copyright (c) 2026 Mayorana"
category = "DeveloperTool"
short_description = "Generate App Store and Play Store screenshots."
long_description = "AppScreens generates marketing screenshots for the App Store and Google Play from a single source image."
icon = ["assets/icon.png"]

[bundle.linux]
# .deb / .AppImage produced by cargo-bundle via `dx bundle`

[bundle.windows]
# Uses assets/favicon.ico as the app icon on Windows
# Set WIX_PATH in CI if you need a custom WiX toolset

[bundle.windows.wix]
# Shows the licence as a page the user accepts before installing. WiX reads it
# as RTF; scripts/license_rtf.py writes it from LICENSE, and release CI reruns
# it before bundling so the page always matches.
license = "installer/LICENSE.rtf"

[mobile]
title = "AppScreens"
bundle_identifier = "com.mayorana.appscreens"

[android]
min_sdk_version = 24

[web.app]
title = "AppScreens"
